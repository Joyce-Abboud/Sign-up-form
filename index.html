<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="./style.css" />
</head>

<body>
    <div class="container">
        <div class="left">
            <div class="logo">
                <img src="./odin-lined.png" alt="the odin project logo" class="logo-pic">
                <h1>ODIN</h1>
            </div>
            <a href="https://www.instagram.com/p/DOaY-_gCCw6/?utm_source=ig_web_copy_link&cplk=NTc4MTIwNjQ2YQ==">Photo
                by me, Joyce Abboud</a>
        </div>
        <div class="right">
            <p>This ia not a real online service!
                You know you need something like
                this in your life to help you realize your deepest dreams.
                <br>
                Sign up <em>now</em> to get strated.
                <br>
            </p>
            <p>You <em>know</em> you want to.</p>
            <from>
                <fieldset>Let's do this!
                    <div class="container-field">
                        <div class="form-left">

                            <label for="first">FIRST NAME</label>
                            <input type="text" id="first" name="first_name">

                            <label for="email">EMAIL</label>
                            <input type="email" id="email" name="user_email">

                            <label for="password">PASSWORD</label>
                            <input required="password" name="password" id="user_password">
                        </div>

                        <div class="form-right">
                            <label for="last">LAST NAME</label>
                            <input type="text" id="last" name="last_name">

                            <label for="phone">PHONE NUMBER</label>
                            <input type="tel" id="phonr" name="user_phone">

                            <label for="confirm_password">CONFIRM PASSWORD</label>
                            <input required type="password" name="confirm_password" id="user_confirm_password">
                        </div>
                    </div>

                </fieldset>
                <button type="submit">Create Account</button>
                <p>Already have an account? <a>Log in</a></p>
            </from>
        </div>
    </div>

</body>

</html>
